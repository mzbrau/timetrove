name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          export VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          for (const path of ["package.json", "src-tauri/tauri.conf.json"]) {
            const json = JSON.parse(fs.readFileSync(path, "utf8"));
            json.version = version;
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + "\n");
          }
          let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          cargo = cargo.replace(/^version = "[^"]+"/m, `version = "${version}"`);
          fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          NODE
          cargo update -p time-trove --manifest-path src-tauri/Cargo.toml
          echo "Synced app version to $VERSION"

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: TimeTrove v__VERSION__
          releaseBody: |
            Installers for this release. Upgrading replaces the app binary only;
            `timetrove.db` in the OS app-data directory is preserved.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
